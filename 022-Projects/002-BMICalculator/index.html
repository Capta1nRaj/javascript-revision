<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="./style.css" />
    <title>BMI Calculator</title>
  </head>
  <body>
    <div class="container">
      <div class="calculator-card">
        <h1>BMI Calculator</h1>
        <form id="bmi-form">
          <div class="input-group">
            <label for="height">Height in CM</label>
            <input type="number" id="height" placeholder="Enter height" min="0" step="0.1" required />
          </div>
          <div class="input-group">
            <label for="weight">Weight in KG</label>
            <input type="number" id="weight" placeholder="Enter weight" min="0" step="0.1" required />
          </div>
          <button type="submit">Calculate BMI</button>
          <div id="results"></div>
        </form>
        <div id="weight-guide">
          <h3>BMI Weight Guide</h3>
          <div class="guide-items">
            <div class="guide-item">
              <span class="category">Under Weight</span>
              <span class="range">Less than 18.6</span>
            </div>
            <div class="guide-item">
              <span class="category">Normal Range</span>
              <span class="range">18.6 - 24.9</span>
            </div>
            <div class="guide-item">
              <span class="category">Overweight</span>
              <span class="range">Greater than 24.9</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script src="script.js"></script>
</html>
