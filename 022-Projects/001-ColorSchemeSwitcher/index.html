<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Scheme Switcher</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Color Scheme Switcher</h1>
        <div class="color-boxes">
            <div class="color-box red" id="red"></div>
            <div class="color-box blue" id="blue"></div>
            <div class="color-box black" id="black"></div>
            <div class="color-box green" id="green"></div>
        </div>
        <p class="instruction">Select a box to change background of this page!</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
